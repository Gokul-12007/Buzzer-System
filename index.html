<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Tracker</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#1b1b1f;--mu:#6b6b76;--bd:#e6e4de;--ok:#1d8a4e;--okb:#e3f5ea;--bad:#c93b3b;--badb:#fde8e8;--warn:#b7791f;--warnb:#fdf3dc;--ac:#2a4bd7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--card:#1c1c21;--tx:#f0f0f3;--mu:#9a9aa6;--bd:#2c2c34;--ok:#5fd18d;--okb:#17301f;--bad:#ff7a7a;--badb:#3a1c1c;--warn:#f0c15c;--warnb:#37300f;--ac:#7f9bff}}
:root[data-theme="dark"]{--bg:#121215;--card:#1c1c21;--tx:#f0f0f3;--mu:#9a9aa6;--bd:#2c2c34;--ok:#5fd18d;--okb:#17301f;--bad:#ff7a7a;--badb:#3a1c1c;--warn:#f0c15c;--warnb:#37300f;--ac:#7f9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:650;font-size:16px}
.cnt{color:var(--mu);font-size:13px;margin-top:2px}
.pct{font-weight:700;font-size:17px;padding:6px 10px;border-radius:12px;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:12px 0 4px;position:relative;overflow:hidden}
.fill{height:100%;border-radius:6px}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.55;left:75%}
.msg{margin:10px 0;padding:9px 11px;border-radius:10px;font-size:14px}
.row{display:flex;gap:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 12px;cursor:pointer}
.p{flex:1;background:var(--okb);color:var(--ok);border-color:transparent;font-weight:650}
.a{flex:1;background:var(--badb);color:var(--bad);border-color:transparent;font-weight:650}
.s{padding:11px 14px;color:var(--mu)}
.edit{display:none;margin-top:10px;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mu)}
.edit.on{display:flex}
.edit input{width:64px;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
.sm{font-size:13px;padding:8px 12px;color:var(--mu)}
</style></head><body><main>
<h1>Attendance Tracker</h1>
<div class="sub">Goal: 75% by the end of term. Tap Present or Absent after each class.</div>
<div id="list"></div>
<div class="foot"><button class="sm" id="rst">Reset to starting data</button><span class="sub" id="sv"></span></div>
</main>
<script>
var KEY="attendance-v1";
var DEF=[["Advanced Direct Tax Laws",35,44,60],["Financial Services",38,42,45],["Data Analytics Programming",51,58,70],["Financial Reporting – I",43,53,60],["Principles of Strategic Management",46,52,60],["Human Resource Management",29,36,45],["Advanced Financial Management",59,70,75]];
function fresh(){return DEF.map(function(d){return{n:d[0],a:d[1],h:d[2],t:d[3],hist:[]}})}
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(Array.isArray(p)&&p.length===DEF.length)S=p}}catch(e){}
var open={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){document.getElementById("sv").textContent="Couldn’t save in this browser"}}
function calc(s){
  var rem=Math.max(0,s.t-s.h),req=Math.ceil(0.75*s.t-1e-9),need=Math.max(0,req-s.a);
  return{rem:rem,req:req,need:need,pct:s.h?s.a/s.h*100:0,max:s.t?(s.a+rem)/s.t*100:0,canMiss:rem-need,ok:s.a+rem>=req}
}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var h="";
  S.forEach(function(s,i){
    var c=calc(s),col,bg,msg,mb,mc;
    if(c.pct>=75){col="var(--ok)";bg="var(--okb)"}else{col="var(--bad)";bg="var(--badb)"}
    if(!c.ok){msg="Can’t reach 75% anymore. Best case if you attend every remaining class: "+c.max.toFixed(1)+"%.";mb="var(--badb)";mc="var(--bad)"}
    else if(c.rem===0){msg=c.need===0?"Term complete. You finished at or above 75%.":"Term complete.";mb="var(--okb)";mc="var(--ok)"}
    else if(c.need===0){msg="Safe. You’ve already locked in 75%. You can miss up to "+c.canMiss+" of the remaining "+c.rem+" classes.";mb="var(--okb)";mc="var(--ok)"}
    else{msg="Attend at least "+c.need+" of the remaining "+c.rem+" classes. You can miss "+c.canMiss+" more.";mb="var(--warnb)";mc="var(--warn)"}
    h+='<div class="card"><div class="top"><div><div class="name">'+esc(s.n)+'</div><div class="cnt">'+s.a+' of '+s.h+' attended · '+c.rem+' left of '+s.t+'</div></div><div class="pct" style="color:'+col+';background:'+bg+'">'+c.pct.toFixed(2)+'%</div></div>'
    +'<div class="bar"><div class="fill" style="width:'+Math.min(100,c.pct)+'%;background:'+col+'"></div><div class="mark"></div></div>'
    +'<div class="msg" style="background:'+mb+';color:'+mc+'">'+msg+'</div>'
    +'<div class="row"><button class="p" data-i="'+i+'" data-k="p"'+(c.rem?'':' disabled')+'>Present</button><button class="a" data-i="'+i+'" data-k="a"'+(c.rem?'':' disabled')+'>Absent</button><button class="s" data-i="'+i+'" data-k="u"'+(s.hist.length?'':' disabled')+'>Undo</button><button class="s" data-i="'+i+'" data-k="e">Edit</button></div>'
    +'<div class="edit'+(open[i]?' on':'')+'">Attended <input type="number" min="0" data-i="'+i+'" data-f="a" value="'+s.a+'"> Held <input type="number" min="0" data-i="'+i+'" data-f="h" value="'+s.h+'"> Total <input type="number" min="1" data-i="'+i+'" data-f="t" value="'+s.t+'"></div></div>';
  });
  document.getElementById("list").innerHTML=h;
}
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;
  var i=+b.dataset.i,k=b.dataset.k,s=S[i];
  if(k==="p"){s.a++;s.h++;s.hist.push("p")}
  else if(k==="a"){s.h++;s.hist.push("a")}
  else if(k==="u"){var l=s.hist.pop();if(l==="p")s.a--;s.h--}
  else if(k==="e"){open[i]=!open[i]}
  save();render();
});
document.getElementById("list").addEventListener("change",function(e){
  var t=e.target;if(!t.dataset.f)return;
  var s=S[+t.dataset.i],v=Math.max(0,parseInt(t.value,10)||0);
  s[t.dataset.f]=v;if(s.a>s.h)s.a=s.h;s.hist=[];
  save();render();
});
document.getElementById("rst").onclick=function(){if(confirm("Reset everything to your starting numbers?")){S=fresh();open={};save();render()}};
render();
</script></body></html>
